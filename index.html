<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoiseCare Pilot v5</title>
<style>
body{margin:0;background:#f3efe8;font-family:sans-serif}.app{max-width:430px;margin:auto;background:white;min-height:100vh}.head{background:#34425f;color:white;padding:24px}.card{margin:15px;padding:18px;border:1px solid #ddd;border-radius:16px}button{width:100%;padding:12px;margin-top:8px;background:#34425f;color:white;border:0;border-radius:10px}.hide{display:none}
</style>
</head>
<body>
<div class="app">
<div class="head"><h2>NoiseCare</h2><p>무궁화아파트 Pilot v5</p></div>

<div id="menu" class="card">
<h3>사용자 선택</h3>
<button onclick="resident()">입주민</button>
<button onclick="manager()">관리소</button>
</div>

<div id="resident" class="hide">
<div class="card">
<h3>입주민</h3>
<p>무궁화아파트 101동 102호</p>
</div>
<div class="card">
<h3>소음 기록</h3>
<button onclick="saveRecord()">기록 저장</button>
<p id="myRecord"></p>
</div>
</div>

<div id="manager" class="hide">
<div class="card">
<h3>무궁화아파트 관리소</h3>
<p id="managerRecord">접수 기록 없음</p>
<button onclick="finish()">처리 완료</button>
</div>
</div>

</div>
<script>
function resident(){menu.classList.add('hide');document.getElementById('resident').classList.remove('hide')}
function manager(){menu.classList.add('hide');document.getElementById('manager').classList.remove('hide');load()}
function saveRecord(){
let data={unit:"101동 102호",noise:"충격음",db:"46dB",status:"확인중"};
localStorage.setItem("noiseRecord",JSON.stringify(data));
myRecord.innerHTML="저장 완료<br>충격음 46dB<br>관리소 전달됨";
}
function load(){
let d=JSON.parse(localStorage.getItem("noiseRecord"));
if(d) managerRecord.innerHTML=d.unit+"<br>"+d.noise+" "+d.db+"<br>상태:"+d.status;
}
function finish(){
let d=JSON.parse(localStorage.getItem("noiseRecord"));
if(d){d.status="처리완료";localStorage.setItem("noiseRecord",JSON.stringify(d));load();}
}
</script>
</div>

<!-- NoiseCare V2 추가 패치 -->
<style>
.nc-status-box{
 background:#fff;
 border:1px solid #E3DFD6;
 border-radius:12px;
 padding:12px;
 margin-top:12px;
}
.nc-status-step{
 padding:8px 0;
 font-size:12px;
 border-left:2px solid #D98F4E;
 padding-left:10px;
 margin:6px 0;
}
</style>

<script>
/*
 NoiseCare V2 Patch
 - 기존 화면 유지
 - 관리소 처리 상태 Timeline 추가용
*/

window.noiseCareProcess = [
 {title:"📝 입주민 소음 기록", status:"완료"},
 {title:"👤 관리소 확인", status:"대기"},
 {title:"📌 조치 기록", status:"대기"},
 {title:"💬 관리소 답변", status:"대기"},
 {title:"✅ 처리 완료", status:"대기"}
];

function renderNoiseCareProcess(){
 const box=document.createElement("div");
 box.className="nc-status-box";
 box.innerHTML="<b>민원 처리 과정</b>";
 window.noiseCareProcess.forEach(step=>{
   box.innerHTML += `<div class="nc-status-step">${step.title}<br><small>${step.status}</small></div>`;
 });
 return box;
}
</script>

</body>
</html>
