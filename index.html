<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoiseCare Pilot V1</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;padding:20px;color:#222}
.app{max-width:480px;margin:auto;background:white;border-radius:18px;padding:20px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h1{margin-top:0}
.card{border:1px solid #ddd;border-radius:12px;padding:15px;margin:12px 0}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#1d4ed8;color:white;font-size:16px}
input,textarea,select{width:100%;padding:10px;margin-top:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
.timeline div{padding:10px;border-left:3px solid #2563eb;margin:8px 0}
.small{color:#666;font-size:13px}
</style>
</head>
<body>
<div class="app">
<h1>NoiseCare</h1>
<p>층간소음 기록 + 처리 과정 관리</p>

<div class="card">
<h3>접속 선택</h3>
<button onclick="resident()">🏠 입주민</button>
<button onclick="manager()">🏢 관리사무소</button>
</div>

<div id="screen"></div>
</div>

<script>
let complaint={
 id:"NC-0001",
 apartment:"테스트 아파트 A",
 house:"101동 101호",
 status:"조치중",
 timeline:[
 {t:"05:53",title:"📝 소음 기록"},
 {t:"06:10",title:"👤 관리소 확인"},
 {t:"06:20",title:"📌 조치 기록"},
 {t:"06:30",title:"💬 관리소 답변"}
 ],
 reply:"확인 후 안내 조치를 진행했습니다."
};

function resident(){
document.getElementById("screen").innerHTML=`
<div class="card">
<h3>${complaint.apartment}</h3>
<p>${complaint.house}</p>
<p>민원번호 : ${complaint.id}</p>
<p>상태 : 🟡 ${complaint.status}</p>
<button onclick="showRecord()">소음 기록하기</button>
<button onclick="showTimeline()">처리 과정 보기</button>
</div>`;
}

function manager(){
document.getElementById("screen").innerHTML=`
<div class="card">
<h3>관리소 Dashboard</h3>
<p>신규 민원 : 1건</p>
<p>${complaint.id} / ${complaint.house}</p>
<textarea id="reply" placeholder="관리소 답변 입력"></textarea>
<button onclick="saveReply()">답변 저장</button>
</div>`;
}

function showRecord(){
document.getElementById("screen").innerHTML=`
<div class="card">
<h3>소음 기록</h3>
<select><option>직접충격음</option><option>공기전달음</option></select>
<textarea placeholder="소음 내용"></textarea>
<button>등록</button>
</div>`;
}

function showTimeline(){
let html='<div class="card timeline"><h3>처리 과정</h3>';
complaint.timeline.forEach(x=>html+=`<div>${x.title}<br><span class="small">${x.t}</span></div>`);
html+=`<h3>관리소 답변</h3><p>${complaint.reply}</p></div>`;
document.getElementById("screen").innerHTML=html;
}

function saveReply(){
complaint.reply=document.getElementById("reply").value || complaint.reply;
alert("답변이 저장되었습니다.");
}
</script>
</body>
</html>
