<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>층간케어 프로토타입</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap');

  :root {
    --slate: #34405A;
    --slate-light: #4C5B7D;
    --amber: #D98F4E;
    --sage: #7C9885;
    --paper: #F7F5F1;
    --charcoal: #2A2521;
    --line: #E3DFD6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #E7E3D9;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
    color: var(--charcoal);
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 24px 50px rgba(0,0,0,0.16);
    min-height: 760px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    background: var(--slate);
    color: white;
    padding: 22px 18px 18px;
    flex-shrink: 0;
  }
  .top-bar .eyebrow { font-size: 11px; opacity: .7; letter-spacing: .04em; }
  .top-bar .title { font-family: 'Noto Serif KR'; font-weight: 700; font-size: 20px; margin-top: 4px; }

  .view { display: none; flex: 1; overflow-y: auto; padding: 16px 16px 90px; }
  .view.active { display: block; }

  /* ---- 요약 카드 ---- */
  .summary-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .summary-card {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    border: 1px solid var(--line);
  }
  .summary-card .num { font-family: 'Noto Serif KR'; font-weight: 700; font-size: 20px; color: var(--slate); }
  .summary-card .label { font-size: 10px; color: #8c8375; margin-top: 2px; }

  /* ---- 타임라인 (파형 모티프) ---- */
  .timeline-item {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .timeline-wave {
    width: 34px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .timeline-wave::before {
    content: '';
    position: absolute;
    top: 34px; left: 50%;
    width: 1.5px; height: calc(100% + 14px);
    background: var(--line);
    transform: translateX(-50%);
  }
  .timeline-item:last-child .timeline-wave::before { display: none; }
  .wave-dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: white;
    border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    z-index: 2;
    flex-shrink: 0;
  }
  .wave-dot.type-impact { border-color: var(--amber); color: var(--amber); }
  .wave-dot.type-air { border-color: var(--slate-light); color: var(--slate-light); }

  .timeline-content {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 11px 13px;
    border: 1px solid var(--line);
  }
  .timeline-content .time-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .timeline-content .time { font-weight: 700; font-size: 12.5px; color: var(--charcoal); }
  .timeline-content .db-badge {
    font-size: 10px; font-weight: 700; color: white;
    background: var(--slate-light);
    padding: 2px 7px; border-radius: 100px;
  }
  .timeline-content .desc { font-size: 11.5px; color: #6b6259; line-height: 1.5; }
  .timeline-content .type-tag { font-size: 10px; color: var(--amber); font-weight: 600; margin-top: 4px; display: inline-block; }

  .empty-state {
    text-align: center; color: #a89f8f; font-size: 12px;
    padding: 60px 20px; line-height: 1.7;
  }

  .fab {
    position: absolute;
    right: 18px; bottom: 90px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--slate);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 8px 20px rgba(52,64,90,0.35);
    cursor: pointer;
    z-index: 10;
  }

  /* ---- 기록 추가 폼 ---- */
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--slate); margin-bottom: 8px; display: block; }
  .type-choice-row { display: flex; gap: 8px; }
  .type-choice {
    flex: 1; padding: 12px 8px; border-radius: 10px;
    border: 1.5px solid var(--line); text-align: center; cursor: pointer;
    font-size: 11.5px; color: #8c8375;
  }
  .type-choice .icon { font-size: 18px; display: block; margin-bottom: 4px; }
  .type-choice.selected { border-color: var(--amber); background: #FBF0E6; color: var(--amber); font-weight: 700; }
  .type-choice.selected.air { border-color: var(--slate-light); background: #EEF0F5; color: var(--slate-light); }

  .form-input, .form-textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 12.5px;
    font-family: 'Pretendard';
    outline: none;
  }
  .form-textarea { min-height: 70px; resize: vertical; }

  .db-meter-row { display: flex; align-items: center; gap: 10px; }
  .db-meter-btn {
    background: var(--slate); color: white; border: none;
    border-radius: 10px; padding: 12px 16px; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  .db-meter-value { font-family: 'Noto Serif KR'; font-weight: 700; font-size: 22px; color: var(--slate); }
  .db-meter-note { font-size: 9.5px; color: #a89f8f; margin-top: 6px; line-height: 1.5; }

  .submit-btn {
    margin-top: 8px;
    background: var(--slate); color: white; text-align: center;
    padding: 13px; border-radius: 12px; font-weight: 700; font-size: 13px;
    cursor: pointer;
  }

  /* ---- 리포트 ---- */
  .report-hero {
    background: linear-gradient(160deg, var(--slate), var(--slate-light));
    color: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .report-hero .period { font-size: 10.5px; opacity: .75; }
  .report-hero .headline { font-family: 'Noto Serif KR'; font-weight: 700; font-size: 17px; margin-top: 6px; line-height: 1.4; }
  .report-stat-row { display: flex; gap: 10px; margin-top: 14px; }
  .report-stat { flex: 1; }
  .report-stat .n { font-family: 'Noto Serif KR'; font-weight: 700; font-size: 18px; }
  .report-stat .l { font-size: 9.5px; opacity: .7; margin-top: 2px; }

  .report-section-title { font-size: 12px; font-weight: 700; color: var(--slate); margin: 18px 0 10px; }
  .report-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .report-bar-label { width: 44px; font-size: 10.5px; color: #8c8375; flex-shrink: 0; }
  .report-bar-track { flex: 1; height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .report-bar-fill { height: 100%; background: var(--amber); border-radius: 6px; }
  .report-bar-count { width: 22px; text-align: right; font-size: 10.5px; color: var(--charcoal); font-weight: 700; }

  .export-btn {
    margin-top: 20px;
    background: white; color: var(--slate); border: 1.5px solid var(--slate);
    text-align: center; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .disclaimer-box {
    margin-top: 14px; background: #EEF0F5; border-radius: 10px; padding: 11px 13px;
    font-size: 10px; color: #6b6259; line-height: 1.6;
  }

  /* ---- 템플릿 ---- */
  .template-card {
    background: white; border: 1px solid var(--line); border-radius: 12px;
    padding: 13px; margin-bottom: 12px;
  }
  .template-card .t-title { font-weight: 700; font-size: 12.5px; color: var(--slate); }
  .template-card .t-situation { font-size: 10px; color: var(--amber); margin-top: 2px; margin-bottom: 8px; font-weight: 600; }
  .template-card .t-body { font-size: 11.5px; color: #6b6259; line-height: 1.6; white-space: pre-line; }
  .template-card .t-copy {
    margin-top: 10px; display: inline-block; font-size: 10.5px; color: var(--slate);
    font-weight: 700; cursor: pointer; border: 1px solid var(--slate); border-radius: 100px;
    padding: 5px 12px;
  }

  .bottom-nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: white;
    display: flex; justify-content: space-around;
    padding: 12px 0 14px;
    border-top: 1px solid var(--line);
    font-size: 10px; color: #b0a89a;
    flex-shrink: 0;
  }
  .bottom-nav .nav-item { cursor: pointer; text-align: center; }
  .bottom-nav .nav-item.on { color: var(--slate); font-weight: 700; }
  .bottom-nav .nav-icon { font-size: 17px; display: block; margin-bottom: 2px; }

  .back-btn { color: white; font-size: 14px; cursor: pointer; margin-bottom: 8px; opacity: .85; }
</style>
<!--
  Supabase 연동 안내
  아래 SUPABASE_URL, SUPABASE_ANON_KEY를 본인의 Supabase 프로젝트 값으로 교체하세요.
  (Project Settings > API 에서 확인 가능)
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app">

  <!-- ===== 홈 (타임라인) ===== -->
  <div class="view active" id="view-home">
    <div class="top-bar">
      <div class="eyebrow">기록이 쌓이면, 패턴이 보입니다</div>
      <div class="title">소음 기록</div>
    </div>
    <div style="padding-top:16px;">
      <div class="summary-row" id="summaryRow"></div>
      <div id="timelineList"></div>
    </div>
    <div class="fab" onclick="switchView('add')">＋</div>
    <div class="bottom-nav">
      <div class="nav-item on" id="nav-home" onclick="switchView('home')"><span class="nav-icon">📋</span>기록</div>
      <div class="nav-item" id="nav-report" onclick="switchView('report')"><span class="nav-icon">📄</span>리포트</div>
      <div class="nav-item" id="nav-template" onclick="switchView('template')"><span class="nav-icon">💬</span>템플릿</div>
    </div>
  </div>

  <!-- ===== 기록 추가 ===== -->
  <div class="view" id="view-add">
    <div class="top-bar">
      <div class="back-btn" onclick="switchView('home')">← 취소</div>
      <div class="title">소음 기록 추가</div>
    </div>
    <div style="padding-top:16px;">
      <div class="form-group">
        <label class="form-label">소음 유형</label>
        <div class="type-choice-row">
          <div class="type-choice selected" id="typeImpact" onclick="selectType('impact')">
            <span class="icon">👣</span>직접충격<br>(뛰거나 걷는 소리)
          </div>
          <div class="type-choice air" id="typeAir" onclick="selectType('air')">
            <span class="icon">🔊</span>공기전달<br>(TV·음향기기)
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">발생 시각</label>
        <input type="datetime-local" class="form-input" id="inputTime">
      </div>

      <div class="form-group">
        <label class="form-label">소음 수준 측정 (참고용)</label>
        <div class="db-meter-row">
          <div class="db-meter-btn" onclick="startRealMeasurement()">🎙 측정 시작 (2.5초)</div>
          <div class="db-meter-value" id="dbValue">-- dB</div>
        </div>
        <div class="db-meter-note">※ 스마트폰 마이크는 전문 측정기처럼 보정되어 있지 않아 절대값이 정확하지 않습니다. 법적 효력이 없는 참고 자료이며, 공식 증거가 필요하면 이웃사이센터 무료 측정기 대여를 이용하세요.</div>
      </div>

      <div class="form-group">
        <label class="form-label">메모</label>
        <textarea class="form-textarea" id="inputMemo" placeholder="예: 아이가 뛰어다니는 소리가 20분 넘게 지속됨"></textarea>
      </div>

      <div class="submit-btn" onclick="submitRecord()">기록 저장하기</div>
    </div>
  </div>

  <!-- ===== 리포트 ===== -->
  <div class="view" id="view-report">
    <div class="top-bar">
      <div class="eyebrow">근거 자료로 정리했어요</div>
      <div class="title">리포트</div>
    </div>
    <div style="padding-top:16px;" id="reportBody"></div>
    <div class="bottom-nav">
      <div class="nav-item" id="nav-home2" onclick="switchView('home')"><span class="nav-icon">📋</span>기록</div>
      <div class="nav-item on" id="nav-report2" onclick="switchView('report')"><span class="nav-icon">📄</span>리포트</div>
      <div class="nav-item" id="nav-template2" onclick="switchView('template')"><span class="nav-icon">💬</span>템플릿</div>
    </div>
  </div>

  <!-- ===== 소통 템플릿 ===== -->
  <div class="view" id="view-template">
    <div class="top-bar">
      <div class="eyebrow">감정 대신, 정중하고 명확하게</div>
      <div class="title">소통 템플릿</div>
    </div>
    <div style="padding-top:16px;" id="templateBody"></div>
    <div class="bottom-nav">
      <div class="nav-item" id="nav-home3" onclick="switchView('home')"><span class="nav-icon">📋</span>기록</div>
      <div class="nav-item" id="nav-report3" onclick="switchView('report')"><span class="nav-icon">📄</span>리포트</div>
      <div class="nav-item on" id="nav-template3" onclick="switchView('template')"><span class="nav-icon">💬</span>템플릿</div>
    </div>
  </div>

</div>

<script>
// ============================================================
// Supabase 연동 — 본인의 프로젝트 값으로 교체하세요
// ============================================================
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 브라우저별 임시 식별자 (로그인 붙이기 전까지 "내 기록" 구분용)
function getDeviceId() {
  let id = localStorage.getItem('noisecare_device_id');
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('noisecare_device_id', id);
  }
  return id;
}
const DEVICE_ID = getDeviceId();

let records = []; // Supabase에서 불러온 뒤 채워짐
let isLoading = true;

async function loadRecords() {
  isLoading = true;
  renderHome();
  const { data, error } = await supabaseClient
    .from('records')
    .select('*')
    .eq('device_id', DEVICE_ID)
    .order('occurred_at', { ascending: false });

  if (error) {
    console.error('기록 불러오기 실패:', error);
    records = [];
  } else {
    records = data.map(r => ({
      id: r.id,
      type: r.type,
      time: r.occurred_at.slice(0, 16), // datetime-local 형식에 맞춤
      db: r.db_level,
      memo: r.memo,
    }));
  }
  isLoading = false;
  renderHome();
}
let selectedType = 'impact';

const templates = [
  {
    title: '첫 안내 메시지 (이웃에게)',
    situation: '처음 정중하게 알릴 때',
    body: `안녕하세요, 아래층(또는 옆집)입니다.
다름이 아니라 최근 저녁 시간대에 소음이 조금 크게 들려서 조심스럽게 말씀드려요.
혹시 생활하시는 데 큰 불편이 없으시다면, 발걸음이나 가구 소리에 조금만 신경 써주시면 감사하겠습니다.
편안한 저녁 되세요 :)`
  },
  {
    title: '재발 시 안내 메시지',
    situation: '같은 문제가 반복될 때',
    body: `안녕하세요, 다시 한번 조심스럽게 말씀드립니다.
지난번 말씀드린 이후에도 비슷한 시간대에 소음이 계속 들려서요.
혹시 상황을 여쭤봐도 될까요? 함께 해결 방법을 찾아보면 좋을 것 같습니다.`
  },
  {
    title: '관리사무소 요청문',
    situation: '관리사무소에 공식 요청할 때',
    body: `안녕하세요, [동/호수]입니다.
최근 [기간] 동안 위층(또는 인접 세대)에서 반복적인 층간소음이 발생하여 문의드립니다.
첨부한 기록을 참고하셔서, 공동주택관리법 제20조에 따라 해당 세대에 안내 및 중재를 요청드립니다.
필요하시면 층간소음관리위원회 절차 안내도 부탁드립니다.`
  },
  {
    title: '이웃사이센터 상담 신청 시 요약문',
    situation: '외부 기관에 신고할 때',
    body: `[기간] 동안 총 [건수]회의 직접충격 소음이 반복적으로 발생했습니다.
주로 [시간대]에 발생하며, 관리사무소를 통한 1차 안내에도 개선되지 않아 상담을 신청합니다.
첨부한 기록을 참고 자료로 제출합니다.`
  },
];

// ---------- 홈: 요약 카드 + 타임라인 ----------
function renderHome() {
  const list = document.getElementById('timelineList');

  if (isLoading) {
    document.getElementById('summaryRow').innerHTML = '';
    list.innerHTML = `<div class="empty-state">기록을 불러오는 중이에요...</div>`;
    return;
  }

  const total = records.length;
  const impactCount = records.filter(r => r.type === 'impact').length;
  const avgDb = total ? Math.round(records.reduce((s, r) => s + r.db, 0) / total) : 0;

  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card"><div class="num">${total}</div><div class="label">전체 기록</div></div>
    <div class="summary-card"><div class="num">${impactCount}</div><div class="label">직접충격</div></div>
    <div class="summary-card"><div class="num">${avgDb}dB</div><div class="label">평균 수준</div></div>
  `;

  const sorted = [...records].sort((a, b) => new Date(b.time) - new Date(a.time));
  if (sorted.length === 0) {
    list.innerHTML = `<div class="empty-state">아직 기록이 없어요.<br>오른쪽 아래 ＋ 버튼으로 첫 기록을 남겨보세요.</div>`;
    return;
  }
  list.innerHTML = sorted.map(r => {
    const d = new Date(r.time);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const icon = r.type === 'impact' ? '👣' : '🔊';
    const typeLabel = r.type === 'impact' ? '직접충격 소음' : '공기전달 소음';
    return `
      <div class="timeline-item">
        <div class="timeline-wave"><div class="wave-dot type-${r.type}">${icon}</div></div>
        <div class="timeline-content">
          <div class="time-row">
            <span class="time">${dateStr}</span>
            <span class="db-badge">${r.db}dB</span>
          </div>
          <div class="desc">${r.memo || '메모 없음'}</div>
          <span class="type-tag">${typeLabel}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ---------- 기록 추가 ----------
function selectType(type) {
  selectedType = type;
  document.getElementById('typeImpact').classList.toggle('selected', type === 'impact');
  document.getElementById('typeAir').classList.toggle('selected', type === 'air');
}

// ---------- 실제 마이크 dB 측정 ----------
// 참고: 스마트폰 마이크는 전문 소음측정기처럼 보정되어 있지 않아,
// 절대적인 데시벨 값이 정확하지 않습니다. "상대적인 크기 비교" 용도로만 참고하세요.
function rmsToApproxDb(rms) {
  const safeRms = Math.max(rms, 0.0001);
  let db = Math.round(20 * Math.log10(safeRms) + 90); // 경험적 보정값 — 일반 실내 소음이 대략 30~70dB대로 나오도록 조정
  return Math.max(20, Math.min(100, db));
}

async function startRealMeasurement() {
  const btn = document.querySelector('.db-meter-btn');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('이 브라우저는 마이크 측정을 지원하지 않아요.');
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    alert('마이크 접근 권한이 필요해요. 브라우저 설정에서 마이크 권한을 허용해주세요.');
    return;
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);
  const dataArray = new Uint8Array(analyser.fftSize);

  btn.textContent = '🎙 측정 중...';
  const samples = [];
  const durationMs = 2500;
  const startTime = Date.now();

  function tick() {
    analyser.getByteTimeDomainData(dataArray);
    let sumSquares = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const norm = (dataArray[i] - 128) / 128;
      sumSquares += norm * norm;
    }
    const rms = Math.sqrt(sumSquares / dataArray.length);
    samples.push(rms);

    const liveDb = rmsToApproxDb(rms);
    document.getElementById('dbValue').textContent = liveDb + ' dB';

    if (Date.now() - startTime < durationMs) {
      requestAnimationFrame(tick);
    } else {
      // 측정 종료: 마이크 스트림 정리
      stream.getTracks().forEach(t => t.stop());
      audioCtx.close();

      const peakRms = Math.max(...samples); // 순간 최고치를 대표값으로 사용 (소음 이벤트 특성상)
      const finalDb = rmsToApproxDb(peakRms);
      document.getElementById('dbValue').textContent = finalDb + ' dB';
      document.getElementById('dbValue').dataset.val = finalDb;
      btn.textContent = '🎙 다시 측정';
    }
  }
  tick();
}

async function submitRecord() {
  const timeInput = document.getElementById('inputTime').value;
  const memo = document.getElementById('inputMemo').value.trim();
  const dbVal = document.getElementById('dbValue').dataset.val || 40;

  if (!timeInput) {
    alert('발생 시각을 입력해주세요.');
    return;
  }

  const submitBtn = document.querySelector('.submit-btn');
  submitBtn.textContent = '저장 중...';

  const { error } = await supabaseClient.from('records').insert({
    device_id: DEVICE_ID,
    type: selectedType,
    occurred_at: new Date(timeInput).toISOString(),
    db_level: parseInt(dbVal),
    memo: memo,
  });

  submitBtn.textContent = '기록 저장하기';

  if (error) {
    console.error('기록 저장 실패:', error);
    alert('저장에 실패했어요. 잠시 후 다시 시도해주세요.');
    return;
  }

  // 폼 초기화
  document.getElementById('inputTime').value = '';
  document.getElementById('inputMemo').value = '';
  document.getElementById('dbValue').textContent = '-- dB';
  document.getElementById('dbValue').dataset.val = '';
  selectType('impact');

  await loadRecords(); // 서버에서 새로 불러와서 목록 갱신
  switchView('home');
}

// ---------- 리포트 ----------
function renderReport() {
  const total = records.length;
  const impactCount = records.filter(r => r.type === 'impact').length;
  const airCount = total - impactCount;
  const overLimit = records.filter(r => r.db >= 39).length;

  // 시간대별 집계 (간단히 저녁/밤/새벽 구간으로)
  const hourBuckets = { '18-21시': 0, '21-24시': 0, '0-6시': 0, '6-18시': 0 };
  records.forEach(r => {
    const h = new Date(r.time).getHours();
    if (h >= 18 && h < 21) hourBuckets['18-21시']++;
    else if (h >= 21 || h < 0) hourBuckets['21-24시']++;
    else if (h >= 0 && h < 6) hourBuckets['0-6시']++;
    else hourBuckets['6-18시']++;
  });
  const maxBucket = Math.max(...Object.values(hourBuckets), 1);

  document.getElementById('reportBody').innerHTML = `
    <div class="report-hero">
      <div class="period">최근 기록 기준 요약</div>
      <div class="headline">총 ${total}건의 소음이<br>기록되었습니다</div>
      <div class="report-stat-row">
        <div class="report-stat"><div class="n">${impactCount}</div><div class="l">직접충격</div></div>
        <div class="report-stat"><div class="n">${airCount}</div><div class="l">공기전달</div></div>
        <div class="report-stat"><div class="n">${overLimit}</div><div class="l">기준초과(39dB↑)</div></div>
      </div>
    </div>

    <div class="report-section-title">시간대별 발생 빈도</div>
    ${Object.entries(hourBuckets).map(([label, count]) => `
      <div class="report-bar-row">
        <div class="report-bar-label">${label}</div>
        <div class="report-bar-track"><div class="report-bar-fill" style="width:${(count/maxBucket*100)}%"></div></div>
        <div class="report-bar-count">${count}</div>
      </div>
    `).join('')}

    <div class="export-btn" id="exportBtn" onclick="exportReportPdf()">📄 PDF 리포트로 내보내기</div>

    <div class="disclaimer-box">
      ⓘ 이 리포트는 기록 패턴을 정리한 참고 자료입니다. 공식 법적 증거가 필요하신 경우, 층간소음이웃사이센터의 전문 측정 서비스를 이용해주세요.
    </div>
  `;
}

// ---------- PDF 내보내기 ----------
async function exportReportPdf() {
  const btn = document.getElementById('exportBtn');
  const originalText = btn.textContent;
  btn.textContent = 'PDF 만드는 중...';
  btn.style.pointerEvents = 'none';
  btn.style.display = 'none'; // 캡처 이미지에 버튼 자체는 안 나오게

  try {
    const reportEl = document.getElementById('reportBody');
    const canvas = await html2canvas(reportEl, {
      backgroundColor: '#F7F5F1',
      scale: 2,
    });
    const imgData = canvas.toDataURL('image/png');

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const margin = 12;
    const imgWidth = pageWidth - margin * 2;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    pdf.addImage(imgData, 'PNG', margin, margin, imgWidth, imgHeight);

    const today = new Date().toISOString().slice(0, 10);
    pdf.save(`층간소음_리포트_${today}.pdf`);
  } catch (err) {
    console.error('PDF 생성 실패:', err);
    alert('PDF 생성에 실패했어요. 잠시 후 다시 시도해주세요.');
  } finally {
    btn.textContent = originalText;
    btn.style.pointerEvents = 'auto';
    btn.style.display = 'block';
  }
}


// ---------- 템플릿 ----------
function renderTemplates() {
  document.getElementById('templateBody').innerHTML = templates.map((t, i) => `
    <div class="template-card">
      <div class="t-title">${t.title}</div>
      <div class="t-situation">${t.situation}</div>
      <div class="t-body">${t.body}</div>
      <div class="t-copy" onclick="copyTemplate(${i})">문구 복사하기</div>
    </div>
  `).join('');
}

function copyTemplate(i) {
  navigator.clipboard.writeText(templates[i].body).then(() => {
    alert('복사되었어요. 원하는 곳에 붙여넣으세요.');
  }).catch(() => {
    alert('복사에 실패했어요. 직접 선택해서 복사해주세요.');
  });
}

// ---------- 뷰 전환 ----------
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('on'));
  document.querySelectorAll(`[id^="nav-${name}"]`).forEach(n => n.classList.add('on'));

  if (name === 'report') renderReport();
  if (name === 'template') renderTemplates();
}

// ---------- 초기화 ----------
loadRecords();
</script>
